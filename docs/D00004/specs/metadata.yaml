key_decisions:
  - 文档范围=仅运输管理模块的页面变更；其余模块页面引用 D00002 不重复
  - 交互形态=独立表单页（待办列表点「维护」跳转独立表单，与 D00002 各阶段表单三态一致）
  - 呈现风格沿用 D00002：ASCII 线框图 + 字段表（字段/控件/必填/校验/数据来源）+ 交互流转说明
  - 新增两页：中转运输（车厂→中转仓库入库，按 VIN）、发车清单（中转仓库→经销商配送，按 VIN），均含列表页 + 表单页
  - 菜单名：车厂→中转仓库这段=「中转运输」；中转仓库→经销商这段=「发车清单」
  - N1 中转运输列表列=VIN/车型/车型年/Buyoff日期/到仓日期/入库状态/操作；过滤=VIN/到仓日期/处理状态
  - N2 发车清单列表列=VIN/车型/车型年/经销商/预计到达日期/签收日期/处理状态/操作；过滤=VIN/经销商/处理状态
  - 旧运输页面（P2/P2.1 运输单、P3/P3.1/P3.2 发车清单三层）从菜单隐藏，页面代码保留可恢复
  - 保留 trolly_type/fully_load 为配送表单可选字段；配送经销商只读带出（取销售分配）
