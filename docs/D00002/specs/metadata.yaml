status: pending_approval
created: 2026-06-24
key_decisions:
  - 呈现粒度：每页 ASCII 线框图 + 字段表（字段/控件/必填/校验/数据来源）+ 交互流转说明
  - 覆盖范围：仅核心业务模块（生产/运输/销售/财务/车辆全景视图）；系统管理与主数据走通用 CRUD 不展开
  - 不含登录页与全局布局框架（顶栏/侧边菜单/面包屑由前端按惯例实现）
  - 全系统统一交互范式：草稿可改 → 确认锁定 → 推进生命周期；前置未确认则入口禁用
  - 物流单据驱动：运输单整单确认、发车清单→行车路单→经销商行按行签收确认
  - 仅车辆全景视图（业务主管）可导出，其余功能仅列表查询
